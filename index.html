<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palabrón">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Palabrón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F5F6F8; --surface:#FFFFFF; --ink:#16181D; --muted:#646A78; --line:#C9CDD6; --cell:#E8EAEE;
  --tile:#16181D; --tile-ink:#FFFFFF; --rack:#FFFFFF; --accent:#2447B8; --accent-ink:#FFFFFF;
  --t14:rgba(36,71,184,.14); --t22:rgba(36,71,184,.22); --t30:rgba(36,71,184,.30); --blank-on-tile:#A9BCF5;
  --warn:#B3261E; --ok:#2447B8;
  --font:"Schibsted Grotesk","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111318; --surface:#1C1F26; --ink:#ECEEF2; --muted:#8C92A1; --line:#343945; --cell:#1C1F26;
    --tile:#ECEEF2; --tile-ink:#111318; --rack:#1C1F26; --accent:#5C7CE6; --accent-ink:#FFFFFF;
    --t14:rgba(92,124,230,.16); --t22:rgba(92,124,230,.24); --t30:rgba(92,124,230,.34); --blank-on-tile:#2447B8;
    --warn:#F2A09A; --ok:#8FA6F0;
  }
}
:root[data-theme="dark"]{
  --ground:#111318; --surface:#1C1F26; --ink:#ECEEF2; --muted:#8C92A1; --line:#343945; --cell:#1C1F26;
  --tile:#ECEEF2; --tile-ink:#111318; --rack:#1C1F26; --accent:#5C7CE6; --accent-ink:#FFFFFF;
  --t14:rgba(92,124,230,.16); --t22:rgba(92,124,230,.24); --t30:rgba(92,124,230,.34); --blank-on-tile:#2447B8;
  --warn:#F2A09A; --ok:#8FA6F0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.ico{width:48px;height:48px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);padding:0}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico:disabled{opacity:.3}

/* ---------- Fichas ---------- */
.tile{position:relative;display:grid;place-items:center;font-weight:700;line-height:1;user-select:none;
  background:var(--rack);color:var(--ink);border:1.5px solid var(--line);border-radius:8px}
.tile .pt{position:absolute;right:6px;bottom:4px;font-size:.4em;font-weight:500;color:var(--muted)}
.tile.blank .ltr{color:var(--accent)}

/* ---------- Inicio ---------- */
.home{flex:1;overflow:auto;padding:36px 20px 28px}
.hero{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:420px}
.hero .tile{aspect-ratio:1;font-size:clamp(18px,6vw,30px);background:var(--tile);color:var(--tile-ink);border:0;border-radius:6px}
.hero .tile:nth-child(7){background:var(--accent);color:#fff}
.hero .tile .pt{display:none}
.tagline{color:var(--muted);margin:18px 0 32px;font-size:1rem;line-height:1.5;max-width:34ch}
.section h2{font-size:.95rem;font-weight:700;margin:0 0 6px}
.prow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow input,.prow select{border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0}
.prow input{flex:1;min-width:0;font-weight:600}
.prow select{color:var(--muted);text-align:right}
.prow .ico{width:40px;height:40px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:12px 0}
.big{width:100%;border:0;border-radius:14px;height:54px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.big.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-bottom:12px}
.small{color:var(--muted);font-size:.86rem;line-height:1.45}

/* ---------- Juego ---------- */
.game{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 16px 14px}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.top .ico{margin-left:-12px}
.bag{font-size:.82rem;color:var(--muted)}
.scores{display:flex;gap:28px;padding:8px 2px 18px;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;border-bottom:2px solid transparent;flex:0 0 auto}
.chip .nm{font-size:.8rem;color:var(--muted);white-space:nowrap}
.chip .sc{font-size:2.1rem;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--muted)}
.chip.on{border-color:var(--accent)} .chip.on .sc{font-weight:800;color:var(--ink)}
.boardwrap{overflow:auto;flex:0 0 auto;margin:0 -4px;padding:0 4px;max-height:calc(100vw + 4px)}
.board{--size:min(calc(100vw - 32px),528px);width:var(--size);display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:2px;margin:0 auto}
.board.zoom{--size:calc(min(calc(100vw - 32px),528px)*1.75)}
.cell{aspect-ratio:1;background:var(--cell);border:0;border-radius:4px;padding:0;display:grid;place-items:center;line-height:1;
  font-size:calc(var(--size)/15*.34);font-weight:600;color:var(--muted);position:relative}
.cell.p3{background:var(--t30);color:var(--accent);font-weight:800}
.cell.p2{background:var(--t14);color:var(--accent);font-weight:700}
.cell.l3{color:var(--ink);font-weight:800}
.cell.star{background:var(--t22);color:var(--accent);font-size:calc(var(--size)/15*.3)}
.cell .tile{width:100%;height:100%;border:0;border-radius:4px;background:var(--tile);color:var(--tile-ink);font-size:calc(var(--size)/15*.56)}
.cell .tile .pt{display:none}
.cell .tile.blank .ltr{color:var(--blank-on-tile)}
.cell .tile.pend{background:var(--accent);color:#fff}
.cell .tile.pend.blank .ltr{color:#fff;text-decoration:underline;text-underline-offset:2px}
.cell .tile.recent{box-shadow:inset 0 0 0 2px var(--accent)}
.status{margin-top:auto;min-height:48px;display:flex;align-items:baseline;justify-content:center;gap:8px;text-align:center;font-size:.95rem;line-height:1.3;padding:8px 0}
.status .w{font-size:1.06rem;font-weight:700;letter-spacing:.04em}
.status .s{font-size:1.06rem;font-weight:500;color:var(--accent)}
.status.bad{color:var(--warn)}
.rack{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 0 16px;max-width:420px;width:100%;margin:0 auto}
.rack .slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px}
.rack .tile{aspect-ratio:1;width:100%;font-size:min(6.4vw,28px);padding:0;transition:transform .12s}
.rack .tile.sel{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.rack .tile:disabled{cursor:default}
.actions{display:flex;align-items:center;gap:4px}
.play{flex-grow:1;height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem}
.play:disabled{opacity:.3}

/* ---------- Hojas ---------- */
.veil{position:fixed;inset:0;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--ground);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:1.15rem;font-weight:700}
.letters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.letters .tile{aspect-ratio:1;font-size:1.3rem;padding:0}
.letters .tile.sel{border-color:var(--accent);background:var(--t14)}
.handoff{position:fixed;inset:0;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:20;text-align:center;padding:24px}
.handoff h2{font-size:2.4rem;margin:0;font-weight:800;letter-spacing:-.02em} .handoff p{color:var(--muted);margin:0}
.handoff button{margin-top:26px;border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:14px;height:54px;padding:0 32px;font-size:1.05rem}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.hist li span:last-child{font-weight:700}
.menu button.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 0;font-size:1rem}
.check{display:flex;gap:8px;margin:0 0 4px}
.check input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:46px;background:var(--surface);color:var(--ink);font:inherit;text-transform:uppercase}
.check button{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:0 16px;font-weight:700}
.thinking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.thinking{animation:none}.rack .tile{transition:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:.85rem}
.legend i{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-style:normal;font-size:8px;font-weight:800;background:var(--cell)}
.rules p{line-height:1.55;margin:0 0 12px}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="home" id="home">
    <div class="hero" id="hero" aria-label="Palabrón"></div>
    <p class="tagline">Forma palabras en español, gánale a la compu o pásale el cel a quien quiera jugar. Sin anuncios.</p>
    <button class="big alt hidden" id="resumeBtn">Seguir partida</button>
    <div class="section">
      <h2>Jugadores</h2>
      <div id="plist"></div>
      <button class="linkbtn" id="addP">Agregar jugador</button>
    </div>
    <button class="big" id="startBtn" style="margin-top:18px">Empezar partida</button>
    <p class="small" id="record" style="margin-top:16px"></p>
  </section>

  <section class="game hidden" id="game">
    <div class="top">
      <button class="ico" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
      <div class="bag"><span id="bagN">0</span> en bolsa</div>
    </div>
    <div class="scores" id="scores"></div>
    <div class="boardwrap" id="boardwrap"><div class="board" id="board"></div></div>
    <div class="status" id="status"></div>
    <div class="rack" id="rack"></div>
    <div class="actions">
      <button class="ico" id="recallBtn" aria-label="Recoger fichas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ico" id="shufBtn" aria-label="Revolver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg></button>
      <button class="ico" id="swapBtn" aria-label="Cambiar fichas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></button>
      <button class="ico" id="passBtn" aria-label="Pasar turno"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg></button>
      <button class="ico" id="hintBtn" aria-label="Pista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg></button>
      <button class="play" id="playBtn" disabled>Jugar</button>
    </div>
  </section>
</div>
<div id="overlay"></div>

<script>
// ===== Motor de Palabrón (sin DOM) =====
const ALPHA = "abcdefghijklmnopqrstuvwxyzñ";
const LIDX = {}; for (let i = 0; i < ALPHA.length; i++) LIDX[ALPHA[i]] = i;
const N = 15, CENTER = 7;
const BAG_DEF = { a:12,e:12,o:9,i:6,s:6,r:6,n:5,l:5,u:5,d:5,t:4,c:4,m:3,p:2,b:2,g:2,h:2,v:1,y:1,q:1,f:1,j:1,"ñ":1,x:1,z:1,"?":2 };
const VAL = { a:1,e:1,o:1,i:1,s:1,n:1,r:1,l:1,u:1,t:1,d:2,g:2,c:3,m:3,b:3,p:3,f:4,h:4,v:4,y:4,q:5,j:6,z:6,"ñ":8,x:8,"?":0 };
const RACK = 7, BINGO = 50;
// Casillas premium (diseño propio, simetría de 8 ejes)
const PREM = (() => {
  const g = Array.from({length:N}, () => Array(N).fill(""));
  const q = { "3P":[[0,3]], "2P":[[1,1],[2,5],[4,4]], "3L":[[1,6],[5,5]], "2L":[[0,7],[3,3],[6,6],[1,3]] };
  for (const [t, list] of Object.entries(q)) for (const [r0,c0] of list)
    for (const [r,c] of [[r0,c0],[c0,r0]]) for (const [rr,cc] of [[r,c],[r,14-c],[14-r,c],[14-r,14-c]]) g[rr][cc] = t;
  g[CENTER][CENTER] = "2P";
  return g;
})();

let EDGES = null;
function loadDawg(b64) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  EDGES = new Uint32Array(u8.buffer);
}
// nodo = índice de inicio de su lista de aristas (0 = sin hijos). raíz = 1
function findEdge(node, li) {
  if (!node) return -1;
  for (let i = node; ; i++) { const e = EDGES[i]; if ((e & 31) === li) return i; if (e & 64) return -1; }
}
function isWord(w) {
  let node = 1, fin = false;
  for (const ch of w) { const li = LIDX[ch]; if (li === undefined) return false; const i = findEdge(node, li); if (i < 0) return false; const e = EDGES[i]; node = e >>> 7; fin = !!(e & 32); }
  return fin;
}

function newBag() { const b = []; for (const [k,n] of Object.entries(BAG_DEF)) for (let i=0;i<n;i++) b.push(k); return shuffle(b); }
function shuffle(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function emptyBoard() { return Array.from({length:N}, () => Array(N).fill(null)); } // celda: {ch, blank}

// ---- Validación y puntaje de una jugada humana ----
// board: tablero actual; placed: [{r,c,ch,blank}]
function evaluateMove(board, placed) {
  if (!placed.length) return { ok:false, msg:"Coloca al menos una ficha" };
  const at = (r,c) => { if (r<0||c<0||r>=N||c>=N) return null; const p = placed.find(t=>t.r===r&&t.c===c); return p ? p : board[r][c]; };
  const rows = new Set(placed.map(p=>p.r)), cols = new Set(placed.map(p=>p.c));
  let dir;
  if (rows.size === 1 && cols.size === 1) {
    const p = placed[0];
    dir = (at(p.r,p.c-1)||at(p.r,p.c+1)) ? "H" : "V";
  } else if (rows.size === 1) dir = "H"; else if (cols.size === 1) dir = "V";
  else return { ok:false, msg:"Las fichas deben ir en una sola línea" };
  const dr = dir==="V"?1:0, dc = dir==="H"?1:0;
  const s = placed.reduce((a,p)=> (dir==="H"? (p.c<a.c?p:a) : (p.r<a.r?p:a)));
  const e = placed.reduce((a,p)=> (dir==="H"? (p.c>a.c?p:a) : (p.r>a.r?p:a)));
  for (let r=s.r, c=s.c; r<=e.r && c<=e.c; r+=dr, c+=dc) if (!at(r,c)) return { ok:false, msg:"Deja huecos entre fichas" };
  const boardEmpty = board.every(row=>row.every(x=>!x));
  if (boardEmpty) {
    if (!placed.some(p=>p.r===CENTER&&p.c===CENTER)) return { ok:false, msg:"La primera palabra debe pasar por la estrella" };
    if (placed.length < 2) return { ok:false, msg:"La primera palabra necesita 2 letras o más" };
  } else {
    const touches = placed.some(p => [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b]) => board[p.r+a]?.[p.c+b]));
    if (!touches) return { ok:false, msg:"La palabra debe conectarse con las del tablero" };
  }
  const words = [];
  const readWord = (r0,c0,dr,dc) => {
    let r=r0, c=c0; while (at(r-dr,c-dc)) { r-=dr; c-=dc; }
    let word="", sum=0, wm=1, cells=[];
    while (at(r,c)) {
      const t = at(r,c), isNew = placed.includes(t);
      let v = t.blank ? 0 : VAL[t.ch];
      if (isNew) { const pm = PREM[r][c]; if (pm==="2L") v*=2; else if (pm==="3L") v*=3; else if (pm==="2P") wm*=2; else if (pm==="3P") wm*=3; }
      word += t.ch; sum += v; cells.push([r,c]); r+=dr; c+=dc;
    }
    return { word, score: sum*wm, cells };
  };
  const main = readWord(s.r, s.c, dr, dc);
  if (main.word.length >= 2) words.push(main);
  for (const p of placed) { const cw = readWord(p.r, p.c, dc, dr); if (cw.word.length >= 2) words.push(cw); }
  if (!words.length) return { ok:false, msg:"Forma una palabra de 2 letras o más" };
  const bad = words.filter(w => !isWord(w.word)).map(w=>w.word.toUpperCase());
  let score = words.reduce((a,w)=>a+w.score,0); if (placed.length === RACK) score += BINGO;
  return { ok: bad.length===0, bad, words, score, main: main.word.length>=2 ? main.word : words[0].word,
           msg: bad.length ? (bad.length===1 ? `${bad[0]} no está en el diccionario` : `No están en el diccionario: ${bad.join(", ")}`) : "" };
}

// ---- Generador de jugadas (Appel–Jacobson sobre el DAWG) ----
function generateMoves(board, rack, limit = 4000) {
  const moves = [];
  const boardEmpty = board.every(row=>row.every(x=>!x));
  const counts = new Array(27).fill(0); let blanks = 0;
  for (const t of rack) { if (t === "?") blanks++; else counts[LIDX[t]]++; }
  for (const trans of [false, true]) {
    if (boardEmpty && trans) break;
    const get = (r,c) => (r<0||c<0||r>=N||c>=N) ? null : (trans ? board[c][r] : board[r][c]);
    const prem = (r,c) => trans ? PREM[c][r] : PREM[r][c];
    for (let row = 0; row < N; row++) {
      if (boardEmpty && row !== CENTER) continue;
      // cross-checks
      const cross = new Array(N).fill(-1 >>> 0 & 0x7FFFFFF), crossSum = new Array(N).fill(-1);
      for (let c = 0; c < N; c++) {
        if (get(row,c)) continue;
        if (!get(row-1,c) && !get(row+1,c)) continue;

    <button class="row" id="homeB">Salir al inicio (se guarda la partida)</button>
    <button class="row" id="quitB" style="color:var(--warn)">Terminar partida</button></div>`);
  const check = () => { const w = $("chkIn").value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u0302\u0308]/g, "").normalize("NFC");
    if (!w) return; const ok = isWord(w); $("chkOut").textContent = ok ? `${w.toUpperCase()} sí se vale` : `${w.toUpperCase()} no está en el diccionario`;
    $("chkOut").style.color = ok ? "var(--ok)" : "var(--warn)"; };
  $("chkB").onclick = check; $("chkIn").onkeydown = e => { if (e.key === "Enter") check(); };
  $("zoomB").onclick = () => { zoom = !zoom; closeOverlay(); renderBoard(); };
  $("histB").onclick = () => openSheet(`<h3>Historial</h3>${h.length ? `<ul class="hist">${h.map(x => `<li><span>${esc(S.players[x.p].name)}: ${esc(x.word.toUpperCase())}</span><span>${x.score}</span></li>`).join("")}</ul>` : `<p class="small">Todavía no hay jugadas.</p>`}`);
  $("rulesB").onclick = rulesSheet;
  $("homeB").onclick = goHome;
  $("quitB").onclick = () => confirmSheet("¿Terminar la partida?", "Se cuentan los puntos como van ahorita.", "Terminar", () => endGame(-1));
}
function rulesSheet() {
  openSheet(`<div class="rules"><h3>Cómo se juega</h3>
  <p>Toca una ficha de tu atril y luego una casilla para colocarla. Toca una ficha azul para regresarla. Para reordenar tu atril, toca dos fichas.</p>
  <p>La primera palabra pasa por la estrella. Después, cada palabra se conecta con las que ya están, en una sola fila o columna. Todas las palabras que formes deben existir.</p>
  <p>Las palabras van sin acentos (CAMION, ARBOL). Sí existe la Ñ. No hay K ni W.</p>
  <div class="legend"><span><i style="color:var(--muted)">2L</i>letra doble</span><span><i>3L</i>letra triple</span><span><i style="background:var(--t14);color:var(--accent)">2P</i>palabra doble</span><span><i style="background:var(--t30);color:var(--accent)">3P</i>palabra triple</span></div>
  <p style="margin-top:10px">Usar tus 7 fichas en una jugada es un Pleno: +50 pts. Los comodines valen 0.</p>
  <p>La partida termina cuando alguien se queda sin fichas y la bolsa está vacía, o cuando todos pasan dos veces seguidas.</p></div>`);
}

// ---------- Arranque ----------
renderHero(); renderSetup();
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();

</script>
